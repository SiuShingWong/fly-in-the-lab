<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffer Bench</title>
<style>

:root{
  
  color-scheme: light;
  --chassis:#F4EFE6; --panel:#FFFDF9; --panel-2:#F3ECE0; --line:#DED4C3;
  --text:#2A2723; --muted:#5F584E; --faint:#857D70;
  --amber:#C9741A; --amber-deep:#9A560F; --steel:#3E6E98;
  --good:#2F8A5B; --warn:#A87B0C; --bad:#C2443D; --pink:#C04877;
  --chip-on:#FBEBD6; --screen:#1C2622;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--chassis);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 24px;min-width:0}
button{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.brand small{display:none;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-top:4px;text-transform:uppercase}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.step{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:uppercase;padding:2px 5px;border:1px solid var(--line);border-radius:3px;color:var(--faint);white-space:nowrap}
.step b{font-family:var(--mono);font-weight:600;font-size:11px}
.step.on{color:#fff;background:var(--amber);border-color:var(--amber)}
.step.done{color:var(--muted);border-color:#3a434d}
.lcds{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.lcd{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.lcd .k{font-size:9.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;display:block}
.lcd .v{font-size:15px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px;margin-top:12px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}.lcds{margin-left:0}}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
canvas#stage{width:100%;aspect-ratio:640/420;display:block;border-radius:4px;background:#E4E1DB;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted);padding:7px 4px 1px;min-height:26px}
.hint b{color:var(--amber);font-weight:600}
aside{display:grid;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
.card h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.card h3{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card p{color:var(--muted);font-size:13.5px}
.card p b{color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.lab{font-size:12.5px;font-weight:600;color:var(--muted);width:100%;margin-bottom:-2px}
.lab .note{font-weight:400}
.chip{background:var(--panel-2);border:1px solid #3a434d;border-radius:4px;padding:5px 9px;font-size:13px;cursor:pointer;line-height:1.3}
.chip:hover:not(:disabled){border-color:var(--steel)}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--chip-on)}
.chip:disabled{opacity:.4;cursor:default}
.go{background:var(--amber);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{opacity:.35;cursor:default}
.note{font-size:13px;color:var(--faint)}
.fb{margin-top:8px;border-left:3px solid var(--steel);background:var(--panel-2);padding:6px 10px;border-radius:0 4px 4px 0;font-size:13px;color:var(--text)}
.fb.g{border-color:var(--good)} .fb.w{border-color:var(--warn)} .fb.b{border-color:var(--bad)}
.readout{font-family:var(--mono);font-size:13px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;margin-top:8px}
.readout span{color:var(--amber)}
input[type=range]{accent-color:var(--amber);width:100%;margin:4px 0 0}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.shot{background:#0b0e10;border:1px solid var(--line);border-radius:4px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.shot canvas{width:100%;display:block;border-radius:2px}
.shot span{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
.shot[aria-pressed="true"]{border-color:var(--amber)}
.shot[aria-pressed="true"] span{color:var(--amber)}
#log{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:128px;overflow:auto;display:grid;gap:3px}
#log div{display:grid;grid-template-columns:40px 1fr;gap:6px}
#log time{color:var(--faint)}
#log .g{color:var(--good)} #log .w{color:var(--warn)} #log .b{color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(60,48,30,.35);display:flex;align-items:flex-start;justify-content:center;padding:22px 12px;overflow:auto;z-index:5}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:860px;width:100%;padding:22px clamp(14px,3.5vw,30px);margin-block:auto}
.sheet h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,40px);line-height:1.05;text-wrap:balance}
.sheet h2{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px}
.sheet .lede{color:var(--muted);font-size:17px;max-width:66ch;margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.tip{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 11px;font-size:13.5px;color:var(--muted)}
.tip strong{font-family:var(--display);font-size:15px;letter-spacing:.03em;display:block;margin-bottom:1px;color:var(--text)}
.lanes{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lanes span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--muted)}
.lanes span b{color:var(--text)}
.grade{font-family:var(--display);font-weight:700;font-size:30px;color:var(--amber);line-height:1}
.scoreline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:6px;color:var(--muted)}
.scoreline .big{font-family:var(--mono);font-size:22px;color:var(--text)}
.resgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
@media (max-width:640px){.resgrid{grid-template-columns:minmax(0,1fr)}}
.resgrid canvas{width:100%;max-width:520px;display:block;border-radius:5px;background:#0b0e10}
.cap{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:4px}
.reads{display:grid;gap:5px;margin-top:10px;font-size:13.5px}
.reads div{background:var(--panel-2);border-radius:4px;padding:6px 9px;color:var(--muted)}
.reads b{color:var(--text)}
.ok{color:var(--good)} .meh{color:var(--warn)} .bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--faint);font-weight:600}
td.pts{font-family:var(--mono);white-space:nowrap}
td.nt{color:var(--muted)}
.coach{display:grid;gap:6px;padding:0;list-style:none}
.coach li{background:var(--panel-2);border-left:3px solid var(--steel);padding:7px 11px;border-radius:0 4px 4px 0;font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (max-width:480px){body{padding-inline:10px}.brand{font-size:21px}.lcd{min-width:0}.step{font-size:12px;padding:2px 6px}}


.card,.sheet{box-shadow:0 2px 10px rgba(80,60,30,.08)}
#brief .sheet{max-width:560px}
.resgel canvas{width:100%;max-width:560px;display:block;border-radius:5px;background:#0b0e10;margin-top:12px}
.resgel .cap{font-size:12.5px;color:var(--faint);margin-top:4px}
details.more .resgrid{margin-top:10px}
.today{background:var(--panel-2);border-radius:6px;padding:10px 13px;margin-top:12px;font-size:15px}
.today b{color:var(--text)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.flow span{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow i{color:var(--faint);font-style:normal}
.alt{margin-top:6px;font-size:13px;color:var(--faint)}
details.more{margin-top:6px;font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--steel);font-weight:600}
details.more .resgrid{grid-template-columns:minmax(0,1fr)}

.prog{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.prog b{color:var(--text);font-weight:600}
.job{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 11px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.job b{color:var(--text)}
.job .mono{font-family:var(--mono);font-size:12px}
.rjob{background:var(--panel-2);border-radius:4px;padding:6px 8px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.rjob b{color:var(--text)}
.rjh{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.rjob .row{margin-top:4px}
.rjob .chip{padding:3px 7px;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.card,.sheet{box-shadow:0 2px 10px rgba(80,60,30,.08)}
#brief .sheet{max-width:560px}
.today{background:var(--panel-2);border-radius:6px;padding:10px 13px;margin-top:12px;font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.flow span{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow i{color:var(--faint);font-style:normal}
.job{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 11px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.job b{color:var(--text)}
details.more{margin-top:6px;font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--steel);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand">Buffer Bench<small>Weigh · dilute · pH · label</small></div>
  <div class="steps" id="steps"></div>
  <div class="lcds"><div class="lcd"><span class="k">Lab clock</span><span class="v" id="clockV">Day 1 · 09:00</span></div></div>
</header>
<main>
  <section class="bench">
    <canvas id="stage" width="640" height="420" aria-label="The bench: balance, stirrer and pH meter"></canvas>
    <div class="hint" id="hint"></div>
  </section>
  <aside>
    <div class="card" id="panel"></div>
    <div class="card"><h3>Bench notes</h3><div id="log"></div></div>
  </aside>
</main>
<div class="overlay" id="brief">
  <div class="sheet">
    <h1>Buffer Bench</h1>
    <p class="lede">Make a buffer someone in the lab is waiting for: work out the amounts, weigh, dilute, pH and label it.</p>
    <div class="today" id="briefJob"></div>
    <div class="flow"><span>Plan</span><i>→</i><span>Weigh</span><i>→</i><span>Stocks</span><i>→</i><span>pH</span><i>→</i><span>Volume and label</span></div>
    <p class="note" style="margin-top:12px">Every choice counts. About 5 minutes.</p>
    <div class="btnrow"><button class="go" id="startBtn">Start at the bench</button></div>
  </div>
</div>
<div class="overlay" id="results" hidden><div class="sheet" id="resultsSheet"></div></div>
